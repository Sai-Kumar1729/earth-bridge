[build-system]
# PEP 639 SPDX license expressions need setuptools 77+. Build isolation fetches
# it; an older local setuptools would reject `license = "MIT"` below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "earth-bridge"
version = "0.3.0"
description = "One API over Google Earth Engine, Microsoft Planetary Computer, NASA GIBS and Overture Maps, where every result records its source and licence."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Sai Kumar", email = "saikumarkummari1729@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "gis", "earth-observation", "remote-sensing", "stac",
    "google-earth-engine", "planetary-computer", "overture-maps",
    "geoparquet", "provenance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.22",
    "pandas>=1.5",
    "geopandas>=0.12",
    "shapely>=2.0",
]

[project.optional-dependencies]
# Earth Engine is what produces measured statistics. Without it, earth-bridge
# can search catalogues and serve display tiles but cannot measure anything.
gee = ["earthengine-api>=0.1.370"]
# Improves STAC search and is required for the (currently gated) COG reader.
stac = ["pystac-client>=0.6", "planetary-computer>=1.0", "rasterio>=1.3"]
# Only needed to read Overture Parquet directly from S3. Without it, building
# queries fall back to OpenStreetMap, which is reported in the provenance.
overture = ["duckdb>=0.9"]
parquet = ["pyarrow>=10"]
all = [
    "earthengine-api>=0.1.370",
    "pystac-client>=0.6",
    "planetary-computer>=1.0",
    "rasterio>=1.3",
    "duckdb>=0.9",
    "pyarrow>=10",
]

[tool.setuptools.packages.find]
include = ["earthbridge*", "web_studio*"]

[tool.setuptools.package-data]
# The Studio's HTML, JavaScript and CSS are runtime assets, not just source.
# Without this the wheel ships server.py but none of the page it serves.
web_studio = ["*.html", "*.js", "*.css", "*.svg", "*.png", "*.ico"]

[project.scripts]
earthbridge = "earthbridge.cli:main"

[project.urls]
Homepage = "https://github.com/Sai-Kumar1729/earth-bridge"
Repository = "https://github.com/Sai-Kumar1729/earth-bridge"
Changelog = "https://github.com/Sai-Kumar1729/earth-bridge/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/Sai-Kumar1729/earth-bridge/blob/main/ROADMAP.md"
